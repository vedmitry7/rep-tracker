name: rep-tracker

services:
  api:
    image: ghcr.io/vedmitry7/rep-tracker-api:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_INIT_DATA_MAX_AGE_SECONDS: ${TELEGRAM_INIT_DATA_MAX_AGE_SECONDS:-86400}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: shared-postgres
      POSTGRES_PORT: 5432
    networks:
      - default
      - database
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/db', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  bot:
    image: ghcr.io/vedmitry7/rep-tracker-bot:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Europe/Moscow}
      API_BASE_URL: http://api:8000
      WEEKLY_REPORTS_ENABLED: ${WEEKLY_REPORTS_ENABLED:-false}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
    depends_on:
      api:
        condition: service_healthy

networks:
  default:
    name: rep-tracker_default
  database:
    external: true
    name: shared_postgres_net
