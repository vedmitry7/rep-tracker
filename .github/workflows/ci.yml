name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    name: Test, validate, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rep_tracker_test
          POSTGRES_USER: rep_tracker
          POSTGRES_PASSWORD: rep_tracker_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rep_tracker -d rep_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: rep_tracker_test
      POSTGRES_USER: rep_tracker
      POSTGRES_PASSWORD: rep_tracker_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_HOST_PORT: "5432"
      TELEGRAM_BOT_TOKEN: "123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi"
      API_BASE_URL: http://127.0.0.1:8000
      DEFAULT_TIMEZONE: Europe/Moscow

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
            bot/requirements.txt
            bot/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r api/requirements.txt
          python -m pip install -r api/requirements-dev.txt
          python -m pip install -r bot/requirements.txt
          python -m pip install -r bot/requirements-dev.txt

      - name: Apply migrations to an empty database
        run: alembic upgrade head

      - name: Check models against Alembic head
        run: alembic check

      - name: Run tests
        run: pytest -q

      - name: Compile Python sources
        run: python -m compileall -q api bot

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Build API image
        run: docker build --file api/Dockerfile --tag rep-tracker-api:ci .

      - name: Build bot image
        run: docker build --file bot/Dockerfile --tag rep-tracker-bot:ci .
