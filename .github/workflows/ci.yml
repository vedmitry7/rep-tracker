name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    name: Test, validate, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rep_tracker_test
          POSTGRES_USER: rep_tracker
          POSTGRES_PASSWORD: rep_tracker_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rep_tracker -d rep_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: rep_tracker_test
      POSTGRES_USER: rep_tracker
      POSTGRES_PASSWORD: rep_tracker_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_HOST_PORT: "5432"
      TELEGRAM_BOT_TOKEN: "123456789:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi"
      API_BASE_URL: http://127.0.0.1:8000
      DEFAULT_TIMEZONE: Europe/Moscow

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
            bot/requirements.txt
            bot/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r api/requirements.txt
          python -m pip install -r api/requirements-dev.txt
          python -m pip install -r bot/requirements.txt
          python -m pip install -r bot/requirements-dev.txt

      - name: Apply migrations to an empty database
        run: alembic upgrade head

      - name: Check models against Alembic head
        run: alembic check

      - name: Run tests
        run: pytest -q

      - name: Compile Python sources
        run: python -m compileall -q api bot

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

      - name: Validate production Docker Compose configuration
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: docker compose --file docker-compose.prod.yml config --quiet

  images:
    name: Build ${{ matrix.service }} image
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: API
            dockerfile: api/Dockerfile
            image: ghcr.io/vedmitry7/rep-tracker-api
            cache_scope: api
          - service: bot
            dockerfile: bot/Dockerfile
            image: ghcr.io/vedmitry7/rep-tracker-bot
            cache_scope: bot

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

  deploy:
    name: Deploy production
    # The repository variable is used only for the one-time GHCR visibility bootstrap.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PRODUCTION_DEPLOY_ENABLED == 'true'
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    environment: production
    concurrency:
      group: rep-tracker-production
      cancel-in-progress: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure SSH
        env:
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          test -n "${VPS_SSH_PRIVATE_KEY}"
          test -n "${VPS_KNOWN_HOSTS}"
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${VPS_SSH_PRIVATE_KEY}" > "${HOME}/.ssh/rep-tracker-deploy"
          printf '%s\n' "${VPS_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/rep-tracker-deploy" "${HOME}/.ssh/known_hosts"

      - name: Deploy immutable images
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -Eeuo pipefail
          test -n "${VPS_HOST}"
          test -n "${VPS_PORT}"
          test -n "${VPS_USER}"
          ssh \
            -i "${HOME}/.ssh/rep-tracker-deploy" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
            -p "${VPS_PORT}" \
            "${VPS_USER}@${VPS_HOST}" \
            "bash -s -- '${GITHUB_SHA}'" \
            < .github/scripts/deploy-production.sh
